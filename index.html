<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>
    // Version of THIS launcher. Bump it when you release a new one,
    // and set the same number in the database at /launcher_version.
    var LAUNCHER_VERSION = 1;
    var DB = "https://new-tab-2-d6042-default-rtdb.firebaseio.com";
  </script>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }
    a { color: #aaa; font-size: 20px; text-decoration: none; cursor: pointer; }
    a:hover { color: white; }
  </style>
</head>
<body>

  <div>
    <h1>Bookmark this page</h1>
    <a href="about:blank" target="_blank" id="start">Click to start</a>
  </div>

  <script type="text/plain" id="pageTpl">
<style>
  :root {
    --bg: #070707; --panel: #101010; --panel-hover: #181818;
    --line: #232323; --line-strong: #4a4a4a; --text: #f5f5f5;
    --muted: #7d7d7d; --green: #3ddc84; --red: #ff4d4f;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    background:
      radial-gradient(ellipse 70% 40% at 50% -10%, rgba(255,255,255,0.08), transparent 70%),
      radial-gradient(ellipse 40% 30% at 100% 100%, rgba(255,255,255,0.03), transparent 70%),
      var(--bg);
    background-attachment: fixed;
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  header {
    position: sticky; top: 0; z-index: 10; height: 68px;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 0 6%;
    background: rgba(7,7,7,0.75);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--line);
  }
  .logo { font-size: 18px; font-weight: 800; letter-spacing: 4px; }
  .status {
    display: flex; align-items: center; gap: 9px; color: var(--text);
    font-size: 12.5px; font-weight: 500; letter-spacing: 0.3px; padding: 8px 15px;
    border: 1px solid var(--line); border-radius: 999px; background: rgba(255,255,255,0.02);
    white-space: nowrap;
  }
  .status b { font-weight: 700; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); flex: none; transition: background 0.3s, box-shadow 0.3s; }
  .status.ok b { color: var(--green); }
  .status.ok .dot { background: var(--green); box-shadow: 0 0 10px var(--green); }
  .status.old b { color: var(--red); }
  .status.old .dot { background: var(--red); box-shadow: 0 0 10px var(--red); }
  .status.unknown b { color: var(--muted); }
  .status.checking .dot { animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: 0.25; } }
  main { max-width: 1200px; margin: auto; padding: 56px 6% 90px; }

  .update {
    display: flex; align-items: center; justify-content: space-between; gap: 18px; flex-wrap: wrap;
    margin-bottom: 34px; padding: 18px 22px; border-radius: 14px;
    background: linear-gradient(135deg, rgba(255,77,79,0.12), rgba(255,77,79,0.04));
    border: 1px solid rgba(255,77,79,0.4);
    animation: rise 0.4s ease both;
  }
  .update[hidden] { display: none; }
  .update strong { display: block; font-size: 15px; margin-bottom: 5px; }
  .update .url {
    display: block; font-size: 12px; color: #b9b9b9; word-break: break-all;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; max-width: 640px;
  }
  .actions { display: flex; gap: 10px; flex-wrap: wrap; }
  .btn {
    background: transparent; color: var(--text); border: 1px solid var(--line-strong);
    border-radius: 9px; padding: 10px 16px; font-size: 13px; font-family: inherit; font-weight: 600;
    cursor: pointer; white-space: nowrap; text-decoration: none; display: inline-block;
    transition: background 0.15s, color 0.15s, border-color 0.15s;
  }
  .btn:hover { background: var(--text); color: #000; }
  .btn.primary { background: var(--text); color: #000; border-color: var(--text); }
  .btn.primary:hover { background: #ddd; }

  .heading { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; flex-wrap: wrap; margin-bottom: 34px; }
  .heading h1 { font-size: 48px; font-weight: 800; letter-spacing: -1.8px; margin-bottom: 10px; }
  .heading p { color: var(--muted); font-size: 15px; }
  .count { color: var(--text); font-weight: 600; }
  .search {
    width: 280px; max-width: 100%; background: var(--panel); color: var(--text);
    border: 1px solid var(--line); border-radius: 12px; padding: 14px 18px;
    font-size: 14px; outline: none; transition: border-color 0.2s, background 0.2s, box-shadow 0.2s;
  }
  .search::placeholder { color: #555; }
  .search:focus { border-color: var(--line-strong); background: var(--panel-hover); box-shadow: 0 0 0 4px rgba(255,255,255,0.04); }
  .game-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 16px; }
  .game {
    display: flex; flex-direction: column; background: var(--panel);
    border: 1px solid var(--line); border-radius: 16px; padding: 0; overflow: hidden;
    cursor: pointer; text-align: left; color: var(--text); font-family: inherit;
    transition: transform 0.2s, background 0.2s, border-color 0.2s, box-shadow 0.2s;
    animation: rise 0.4s ease both;
  }
  .game:hover, .game:focus-visible {
    background: var(--panel-hover); border-color: var(--line-strong);
    transform: translateY(-5px); box-shadow: 0 16px 34px rgba(0,0,0,0.6); outline: none;
  }
  .game-thumb {
    position: relative; width: 100%; aspect-ratio: 16 / 10; display: grid; place-items: center;
    overflow: hidden; background: linear-gradient(135deg, #1c1c1c, #0b0b0b); border-bottom: 1px solid var(--line);
  }
  .game-thumb .letter { font-size: 46px; font-weight: 800; color: #333; }
  .game-thumb img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: transform 0.35s ease; }
  .game:hover .game-thumb img { transform: scale(1.07); }
  .game-info { padding: 16px 18px 18px; }
  .game-name { font-size: 16px; font-weight: 700; line-height: 1.25; word-break: break-word; }
  .game-label {
    display: flex; align-items: center; justify-content: space-between; color: var(--muted);
    font-size: 11px; letter-spacing: 1.5px; margin-top: 9px; transition: color 0.2s;
  }
  .game-label .arrow { transition: transform 0.2s; }
  .game:hover .game-label { color: var(--text); }
  .game:hover .game-label .arrow { transform: translateX(4px); }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  .message {
    grid-column: 1 / -1; border: 1px dashed var(--line-strong); border-radius: 14px;
    padding: 30px; color: #aaa; font-size: 14px; line-height: 1.6;
  }
  .message strong { color: var(--text); display: block; font-size: 16px; margin-bottom: 8px; }
  #player { display: none; position: fixed; inset: 0; background: #000; z-index: 100; flex-direction: column; }
  .player-bar {
    height: 52px; flex: none; display: flex; align-items: center; gap: 10px;
    padding: 0 14px; background: #0b0b0b; border-bottom: 1px solid var(--line);
  }
  .player-title {
    flex: 1; text-align: center; font-size: 13px; font-weight: 700; letter-spacing: 1px;
    color: #bbb; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .bar-btn {
    background: transparent; color: var(--text); border: 1px solid var(--line-strong);
    border-radius: 8px; padding: 8px 14px; font-size: 12.5px; font-family: inherit;
    cursor: pointer; white-space: nowrap; transition: background 0.15s, color 0.15s;
  }
  .bar-btn:hover { background: var(--text); color: #000; }
  #gameFrame { flex: 1; width: 100%; border: none; background: #000; }
  @media (max-width: 600px) {
    header { padding: 0 4%; }
    .logo { font-size: 15px; letter-spacing: 3px; }
    .status { font-size: 11.5px; padding: 7px 12px; }
    main { padding-top: 32px; }
    .heading h1 { font-size: 34px; }
    .search { width: 100%; }
    .game-grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }
    .game-info { padding: 12px 14px 14px; }
    .bar-btn.optional { display: none; }
  }
</style>

<header id="header">
  <div class="logo">ABOUT:BLANK</div>
  <div class="status checking" id="status"><span class="dot"></span><span>Your launcher is <b id="statusText">checking...</b></span></div>
</header>

<main id="library">
  <div class="update" id="update" hidden>
    <div>
      <strong>A newer launcher link is available. Bookmark the new one:</strong>
      <span class="url" id="newUrl"></span>
    </div>
    <div class="actions">
      <button class="btn" id="copyBtn" type="button">Copy link</button>
      <a class="btn primary" id="openBtn" href="#" target="_blank" rel="noopener">Open new launcher</a>
    </div>
  </div>
  <div class="heading">
    <div>
      <h1>Titles.</h1>
      <p>Select a title to start playing. <span class="count" id="count"></span></p>
    </div>
    <input class="search" id="search" type="search" placeholder="Search titles..." autocomplete="off" aria-label="Search titles">
  </div>
  <div class="game-grid" id="gameGrid"></div>
</main>

<div id="player">
  <div class="player-bar">
    <button class="bar-btn" id="backBtn">&larr; Back</button>
    <div class="player-title" id="playerTitle"></div>
    <button class="bar-btn optional" id="fsBtn">Fullscreen</button>
  </div>
  <iframe id="gameFrame" src="about:blank" allow="fullscreen; autoplay; gamepad" referrerpolicy="strict-origin-when-cross-origin"></iframe>
</div>
  </script>

  <script>
    function pageMain(DATA, CURRENT, LATEST, NEWEST_URL) {
      var gameGrid = document.getElementById("gameGrid");
      var searchEl = document.getElementById("search");
      var playerEl = document.getElementById("player");
      var libraryEl = document.getElementById("library");
      var headerEl = document.getElementById("header");
      var frameEl = document.getElementById("gameFrame");
      var countEl = document.getElementById("count");

      function toNum(v) {
        var n = Number(String(v == null ? "" : v).trim());
        return String(v == null ? "" : v).trim() === "" || isNaN(n) ? null : n;
      }

      function showStatus() {
        var box = document.getElementById("status");
        var text = document.getElementById("statusText");
        box.classList.remove("checking", "ok", "old", "unknown");

        var latestNum = toNum(LATEST);
        var currentNum = toNum(CURRENT);

        if (latestNum === null || currentNum === null) {
          box.classList.add("unknown");
          text.textContent = "unverified";
          return;
        }
        if (currentNum >= latestNum) {
          box.classList.add("ok");
          text.textContent = "Up to date";
          return;
        }

        box.classList.add("old");
        text.textContent = "Outdated";

        var newUrl = String(NEWEST_URL || "").trim();
        var urlEl = document.getElementById("newUrl");
        var open = document.getElementById("openBtn");
        var copyBtn = document.getElementById("copyBtn");
        if (newUrl) {
          urlEl.textContent = newUrl;
          if (/^https?:\/\//i.test(newUrl)) open.href = newUrl;
          else open.style.display = "none";
        } else {
          urlEl.textContent = "Ask whoever shared this for the new link.";
          open.style.display = "none";
          copyBtn.style.display = "none";
        }
        document.getElementById("update").hidden = false;

        copyBtn.addEventListener("click", function () {
          function done() {
            copyBtn.textContent = "Copied!";
            setTimeout(function () { copyBtn.textContent = "Copy link"; }, 1800);
          }
          function fallback() {
            var ta = document.createElement("textarea");
            ta.value = newUrl;
            ta.style.cssText = "position:fixed;opacity:0";
            document.body.appendChild(ta);
            ta.select();
            try { document.execCommand("copy"); done(); } catch (e) {}
            ta.remove();
          }
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(newUrl).then(done, fallback);
          } else {
            fallback();
          }
        });
      }

      function toGame(key, value) {
        if (typeof value === "string" && /^https?:\/\//i.test(value)) {
          return { name: key, url: value, image: "" };
        }
        if (value && typeof value === "object") {
          var name = value.name || value.title;
          var url = value.url || value.link || value.href;
          var image = value.image || value.img || value.thumbnail || value.icon || value.cover;
          if (typeof name === "string" && typeof url === "string") {
            return { name: name, url: url, image: typeof image === "string" ? image : "" };
          }
        }
        return null;
      }

      function collect(data) {
        var list = [];
        (function scan(obj, depth) {
          if (!obj || typeof obj !== "object") return;
          Object.keys(obj).forEach(function (key) {
            var g = toGame(key, obj[key]);
            if (g) list.push(g);
            else if (depth < 2) scan(obj[key], depth + 1);
          });
        })(data, 0);
        return list;
      }

      var allGames = collect(DATA);

      function message(title, body) {
        var box = document.createElement("div");
        box.className = "message";
        var t = document.createElement("strong");
        t.textContent = title;
        box.appendChild(t);
        box.appendChild(document.createTextNode(body));
        gameGrid.appendChild(box);
      }

      function render() {
        var q = searchEl.value.trim().toLowerCase();
        var shown = allGames
          .filter(function (g) { return g.name.toLowerCase().indexOf(q) !== -1; })
          .sort(function (a, b) { return a.name.localeCompare(b.name); });

        gameGrid.replaceChildren();
        countEl.textContent = allGames.length
          ? "· " + shown.length + (q ? " of " + allGames.length : "") + " available"
          : "";

        if (shown.length === 0) {
          message("No games found", q ? "Nothing matches your search." : "The library is empty.");
          return;
        }

        shown.forEach(function (game, i) {
          var card = document.createElement("button");
          card.className = "game";
          card.type = "button";
          card.style.animationDelay = Math.min(i * 25, 400) + "ms";

          var thumb = document.createElement("div");
          thumb.className = "game-thumb";
          var letter = document.createElement("span");
          letter.className = "letter";
          letter.textContent = (game.name.trim()[0] || "?").toUpperCase();
          thumb.appendChild(letter);

          if (game.image) {
            var img = document.createElement("img");
            img.alt = "";
            img.loading = "lazy";
            img.referrerPolicy = "no-referrer";
            img.onerror = function () { img.remove(); };
            img.src = game.image;
            thumb.appendChild(img);
          }

          var info = document.createElement("div");
          info.className = "game-info";
          var name = document.createElement("div");
          name.className = "game-name";
          name.textContent = game.name;

          var label = document.createElement("div");
          label.className = "game-label";
          var play = document.createElement("span");
          play.textContent = "PLAY NOW";
          var arrow = document.createElement("span");
          arrow.className = "arrow";
          arrow.textContent = "→";
          label.appendChild(play);
          label.appendChild(arrow);

          info.appendChild(name);
          info.appendChild(label);
          card.appendChild(thumb);
          card.appendChild(info);
          card.addEventListener("click", function () { openGame(game); });
          gameGrid.appendChild(card);
        });
      }

      function openGame(game) {
        try {
          var parsed = new URL(game.url);
          if (parsed.protocol !== "https:" && parsed.protocol !== "http:") {
            alert("Invalid game URL.");
            return;
          }
          frameEl.src = parsed.href;
          document.getElementById("playerTitle").textContent = game.name.toUpperCase();
          playerEl.style.display = "flex";
          libraryEl.style.display = "none";
          headerEl.style.display = "none";
          document.documentElement.style.overflow = "hidden";
        } catch (e) {
          alert("This game has an invalid URL.");
        }
      }

      function closeGame() {
        frameEl.src = "about:blank";
        playerEl.style.display = "none";
        libraryEl.style.display = "block";
        headerEl.style.display = "flex";
        document.documentElement.style.overflow = "";
      }

      document.getElementById("backBtn").addEventListener("click", closeGame);
      document.getElementById("fsBtn").addEventListener("click", function () {
        if (frameEl.requestFullscreen) frameEl.requestFullscreen();
      });
      document.addEventListener("keydown", function (e) {
        if (e.key === "Escape" && playerEl.style.display === "flex" && !document.fullscreenElement) closeGame();
      });
      searchEl.addEventListener("input", render);

      showStatus();
      render();
    }

    document.getElementById("start").addEventListener("click", function (event) {
      const tab = window.open("about:blank", "_blank");
      if (!tab) return;
      event.preventDefault();
      run(tab);
    });

    function toSafeJson(value) {
      return JSON.stringify(value === undefined ? null : value)
        .replace(/</g, "\\u003c")
        .replace(/\u2028/g, "\\u2028")
        .replace(/\u2029/g, "\\u2029");
    }

    async function run(tab) {
      const doc = tab.document;
      doc.open();
      doc.write("<!DOCTYPE html><html><head><title>Loading</title></head>" +
        "<body style='margin:0;background:#111;color:#fff;font-family:Arial,sans-serif;display:flex;align-items:center;justify-content:center;height:100vh'>Loading...</body></html>");
      doc.close();

      try {
        const getJson = function (path) {
          return fetch(DB + path, { cache: "no-store" })
            .then(function (r) { return r.ok ? r.json() : null; })
            .catch(function () { return null; });
        };
        const [gamesRes, latest, newestUrl] = await Promise.all([
          fetch(DB + "/games.json"),
          getJson("/launcher_version.json"),
          getJson("/newest_url.json")
        ]);
        if (!gamesRes.ok) throw new Error("HTTP " + gamesRes.status);
        const games = await gamesRes.json();

        const latestVersion = (typeof latest === "number" || typeof latest === "string") ? latest : null;
        const newestUrlStr = typeof newestUrl === "string" ? newestUrl : null;

        const srcdoc =
          "<!DOCTYPE html><html lang='en'><head><meta charset='UTF-8'>" +
          "<meta name='viewport' content='width=device-width, initial-scale=1.0'>" +
          "<title>about:blank</title></head><body>" +
          document.getElementById("pageTpl").textContent +
          "<script>(" + pageMain.toString() + ")(" +
            toSafeJson(games) + "," + toSafeJson(LAUNCHER_VERSION) + "," + toSafeJson(latestVersion) + "," + toSafeJson(newestUrlStr) +
          ");<\/script>" +
          "</body></html>";

        const iframe = doc.createElement("iframe");
        iframe.style.cssText = "position:fixed;inset:0;width:100%;height:100%;border:0;background:#000";
        iframe.setAttribute("allow", "fullscreen; autoplay; gamepad; clipboard-write");
        iframe.setAttribute("allowfullscreen", "");
        iframe.srcdoc = srcdoc;

        doc.title = "about:blank";
        doc.body.replaceChildren(iframe);
      } catch (err) {
        doc.body.textContent = "Couldn't load games: " + err.message;
      }
    }
  </script>

</body>
</html>
